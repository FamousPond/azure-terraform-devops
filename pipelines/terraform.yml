# This pipeline will run on a PR to check if the Terraform is valid

trigger:
  - main

pr:
  - main

pool:
  vmImage: ubuntu-latest

variables:
  terraformVersion: '1.17.1'
  terraformDirectory: 'automated_test_1/env_1'

stages:
  - stage: Validate
    displayName: 'Validate Terraform'
    jobs:
      - job: Validate
        displayName: 'Validates Terraform'
        steps:
          - checkout: self
            displayName: 'Checkout repo'

          - task: TerraformInstaller@1
            displayName: 'Installs Terraform'
            inputs:
              terraformVersion: '$(terraformVersion)'

          - script: terraform fmt -check -recursive
            displayName: 'Format Terraform'
            workingDirectory: $(terraformDirectory)

          - script: terraform init -backend=false
            displayName: 'Init Terraform w/o backend'
            workingDirectory: $(terraformDirectory)

          - script: terraform validate
            displayName: 'Validate Terraform'
            workingDirectory: $(terraformDirectory)

  - stage: Plan
    displayName: 'Plan Terraform'
    dependsOn: Validate
    condition: succeeded()
    jobs:
      - job: Plan
        displayName: 'Plan Terraform'
        steps:
          - checkout: self
            displayName: 'Checkout repo'

          - task: TerraformInstaller@1
            displayName: 'Installs Terraform'
            inputs:
              terraformVersion: '$(terraformVersion)'

          - task: TerraformTask@5
            displayName: 'Terraform Init'
            inputs:
              provider: 'azurerm'
              command: 'init'
              backendServiceArm: 'sc-azure-tf-dav'
              backendAzureRmStorageAccountName: 'tfstore1126'
              backendAzureRmContainerName: 'tfstate1'
              backendAzureRmKey: 'dev.tfstate'
              workingDirectory: $(terraformDirectory)

          - task: TerraformTask@5
            displayName: 'Terraform Plan'
            inputs:
              provider: 'azurerm'
              command: 'plan'
              commandOptions: '-input=false -out=tfplan'
              environmentServiceNameAzureRM: 'sc-azure-tf-dav'
              workingDirectory: $(terraformDirectory)

          - script: terraform show -no-color tfplan > $(Build.ArtifactStagingDirectory)/tfplan.txt
            displayName: 'Convert plan to txt'
            workingDirectory: $(terraformDirectory)

          - publish: $(Build.ArtifactStagingDirectory)
            artifact: tfplan.txt

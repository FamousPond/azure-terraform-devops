# This pipeline will run on a PR to check if the Terraform is valid, create a plan and then on a merge into main apply that plan.

trigger:
  - main

pr:
  - main

pool:
  vmImage: ubuntu-latest

variables:
  terraformVersion: '1.17.1'
  terraformDirectory: 'automated_test_1/env_1'
  group: tf-azure-training-vars

stages:
  - stage: Validate
    displayName: 'Validate Terraform'
    jobs:
      - job: Validate
        displayName: 'Validates Terraform'
        steps:
          - script: 'echo "VNet name is: $(testVNetName)"'
            displayName: Debug variables

          - checkout: self
            displayName: 'Checkout repo'

          - task: TerraformInstaller@1
            displayName: 'Installs Terraform'
            inputs:
              terraformVersion: '$(terraformVersion)'

          - script: terraform fmt -check -recursive
            displayName: 'Format Terraform'
            workingDirectory: $(terraformDirectory)

          - script: terraform init -backend=false
            displayName: 'Init Terraform w/o backend'
            workingDirectory: $(terraformDirectory)

          - script: terraform validate
            displayName: 'Validate Terraform'
            workingDirectory: $(terraformDirectory)

  - stage: Plan
    displayName: 'Plan Terraform'
    dependsOn: Validate
    condition: succeeded()
    jobs:
      - job: Plan
        displayName: 'Plan Terraform'
        steps:
          - checkout: self
            displayName: 'Checkout repo'

          - task: TerraformInstaller@1
            displayName: 'Installs Terraform'
            inputs:
              terraformVersion: '$(terraformVersion)'

          - task: TerraformTask@5
            displayName: 'Terraform Init'
            inputs:
              provider: 'azurerm'
              command: 'init'
              backendServiceArm: 'sc-azure-tf-dav'
              backendAzureRmStorageAccountName: 'tfstore1126'
              backendAzureRmContainerName: 'tfstate1'
              backendAzureRmKey: 'dev.tfstate'
              workingDirectory: $(terraformDirectory)

          - task: TerraformTask@5
            displayName: 'Terraform Plan'
            inputs:
              provider: 'azurerm'
              command: 'plan'
              commandOptions: '-input=false -out=$(Build.ArtifactStagingDirectory)/tfplan'
              environmentServiceNameAzureRM: 'sc-azure-tf-dav'
              workingDirectory: $(terraformDirectory)
            env:
              TF_VAR_test_vnet_name: $(testVNetName)

          - publish: $(Build.ArtifactStagingDirectory)
            artifact: tfplan

  - stage: Apply
    displayName: 'Apply Terraform'
    dependsOn: Plan
    condition: >-
      and(
        succeeded(), 
        eq(variables['Build.SourceBranch'], 'refs/heads/main'), 
        ne(variables['Build.Reason'], 'PullRequest')
      )
    jobs:
      - deployment: Apply
        displayName: 'Apply Terraform'
        environment: dev
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  displayName: 'Checkout repo'

                - task: TerraformInstaller@1
                  displayName: 'Installs Terraform'
                  inputs:
                    terraformVersion: '$(terraformVersion)'

                - download: current
                  displayName: 'Download plan'
                  artifact: tfplan

                - task: TerraformTask@5
                  displayName: 'Terraform Init'
                  inputs:
                    provider: 'azurerm'
                    command: 'init'
                    backendServiceArm: 'sc-azure-tf-dav'
                    backendAzureRmStorageAccountName: 'tfstore1126'
                    backendAzureRmContainerName: 'tfstate1'
                    backendAzureRmKey: 'dev.tfstate'
                    workingDirectory: $(terraformDirectory)

                - task: TerraformTask@5
                  displayName: 'Terraform Apply'
                  inputs:
                    provider: 'azurerm'
                    command: 'apply'
                    commandOptions: '-input=false $(Pipeline.Workspace)/tfplan/tfplan'
                    environmentServiceNameAzureRM: 'sc-azure-tf-dav'
                    workingDirectory: $(terraformDirectory)

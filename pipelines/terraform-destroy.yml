# This pipeline has to be manually run and destroys the running deployment.

trigger: none
pr: none

parameters:
- name: destroy
  displayName: Type DESTROY to confirm
  type: string
  default: ''

pool:
  vmImage: ubuntu-latest

variables:
  - group: tf-azure-training-vars
  - template: variables.yml

stages:
  - stage: Destroy
    displayName: 'Destroy Terraform'
    jobs:
      - job: Destroy
        displayName: 'Destroy Terraform'
        steps:
          - bash: |
              if [ "${{ parameters.destroy }}" != "DESTROY" ]; then
                echo "You need to write DESTROY to destroy deployment"
                exit 1
              fi
            displayName: 'Check destroy confirmation'

          - checkout: self
            displayName: 'Checkout repo'

          - task: TerraformInstaller@1
            displayName: 'Installs Terraform'
            inputs:
              terraformVersion: $(terraformVersion)

          - task: TerraformTask@5
            displayName: 'Terraform Init'
            inputs:
              provider: 'azurerm'
              command: 'init'
              backendServiceArm: $(ServiceConnection)
              backendAzureRmStorageAccountName: $(StorageAccountName)
              backendAzureRmContainerName: $(ContainerName)
              backendAzureRmKey: $(StateFile)
              workingDirectory: $(terraformDirectory)

          - task: TerraformTask@5
            displayName: 'Terraform Plan'
            inputs:
              provider: 'azurerm'
              command: 'plan'
              commandOptions: '-destroy -input=false -out=tfplan'
              environmentServiceNameAzureRM: $(ServiceConnection)
              workingDirectory: $(terraformDirectory)
            env:
              TF_VAR_test_vnet_name: $(testVNetName)

          - task: TerraformTask@5
            displayName: 'Terraform Apply'
            inputs:
              provider: 'azurerm'
              command: 'apply'
              commandOptions: '-input=false tfplan'
              environmentServiceNameAzureRM: $(ServiceConnection)
              workingDirectory: $(terraformDirectory)

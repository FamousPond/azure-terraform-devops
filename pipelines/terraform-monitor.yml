# Pipeline will run daily to check if I have infrastructure still up and if I do alert me.

# For initial testing I will set it's trigger to be manual.

trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

variables:
  - group: tf-azure-training-vars
  - template: variables.yml

stages:
  - stage: Show
    displayName: 'Show Terraform State'
    jobs:
      - job: Show
        displayName: 'Show Terraform State'
        steps:
          - template: templates/setup.yml

          - task: TerraformTask@5
            displayName: 'Terraform Show'
            inputs:
              provider: 'azurerm'
              command: 'show'
              commandOptions: '-no-color'
              environmentServiceNameAzureRM: $(ServiceConnection)
              workingDirectory: $(terraformDirectory)
              outputTo: file
              outputFormat: default
              fileName: file.txt

          - script: cat file.txt
            displayName: "Print the show"
            workingDirectory: $(terraformDirectory)

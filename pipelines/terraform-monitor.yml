# Pipeline will run daily to check if I have infrastructure still up and if I do alert me.

# For initial testing I will set it's trigger to be manual.

trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

variables:
  - group: tf-azure-training-vars
  - template: variables.yml

stages:
  - stage: Show
    displayName: 'Show Terraform State'
    jobs:
      - job: Show
        displayName: 'Show Terraform State'
        steps:
          - template: templates/setup.yml

          - task: TerraformTask@5
            displayName: 'Terraform Show'
            inputs:
              provider: 'azurerm'
              command: 'show'
              commandOptions: '-no-color'
              environmentServiceNameAzureRM: $(ServiceConnection)
              workingDirectory: $(terraformDirectory)
              outputTo: file
              outputFormat: default
              fileName: "$(Build.ArtifactStagingDirectory)/state.txt"

          - bash: |
              if grep -qF "The state file is empty. No resources are represented." "$(Build.ArtifactStagingDirectory)/state.txt"; then
                STATE_EMPTY=true
              else
                STATE_EMPTY=false
              fi
              echo "State empty: $STATE_EMPTY"
              echo "##vso[task.setvariable variable=stateEmpty;isOutput=true]$STATE_EMPTY"
            name: stateCheck
            displayName: "Check if state is empty"

          - bash: exit 0
            condition: eq(variables['stateCheck.stateEmpty'], 'true')
            displayName: "Exit if nothing to show"

          - script: cat $(Build.ArtifactStagingDirectory)/file.txt
            displayName: "Print the show"
